<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Televendas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- Tela: login -->
  <section id="tela-login" class="tela centro" hidden>
    <form id="form-login" class="cartao">
      <h1>Televendas</h1>
      <label>Usuário <input id="login-usuario" autocomplete="username" required></label>
      <label>Senha <input id="login-senha" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
      <p class="erro" id="login-erro"></p>
    </form>
  </section>

  <!-- Tela: troca de senha (primeiro acesso) -->
  <section id="tela-trocar" class="tela centro" hidden>
    <form id="form-trocar" class="cartao">
      <h1>Defina sua nova senha</h1>
      <label>Senha atual <input id="trocar-atual" type="password" autocomplete="current-password" required></label>
      <label>Nova senha (mín. 6) <input id="trocar-nova" type="password" autocomplete="new-password" minlength="6" required></label>
      <label>Repita a nova senha <input id="trocar-repete" type="password" autocomplete="new-password" minlength="6" required></label>
      <button type="submit">Salvar</button>
      <p class="erro" id="trocar-erro"></p>
    </form>
  </section>

  <!-- Tela: app (casca; o conteúdo vem nas próximas etapas) -->
  <section id="tela-app" class="tela" hidden>
    <header class="topo">
      <strong>Televendas</strong>
      <span id="topo-usuario"></span>
      <button id="btn-sair" type="button">Sair</button>
    </header>
    <main id="conteudo"><p>Login ok. O kanban entra na próxima etapa.</p></main>
  </section>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
